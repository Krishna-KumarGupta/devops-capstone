apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-manager
  namespace: task-manager
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-manager
  namespace: task-manager
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-manager
  namespace: task-manager
subjects:
  - kind: ServiceAccount
    name: task-manager
    namespace: task-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task-manager
