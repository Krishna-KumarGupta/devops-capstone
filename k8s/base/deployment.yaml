apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-blue
  namespace: task-manager
  labels:
    app: task-manager
    color: blue
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: task-manager
      color: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: task-manager
        color: blue
    spec:
      serviceAccountName: task-manager
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: task-manager
          image: ghcr.io/your-org/task-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: task-manager-config
            - secretRef:
                name: task-manager-db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
