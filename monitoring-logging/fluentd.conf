# Requires fluent-plugin-kubernetes_metadata_filter and fluent-plugin-elasticsearch.
# Mount host log directories read-only and /var/log/fluentd writable for positions/buffers.
# Configure ELASTICSEARCH_HOST/PORT/SCHEME/USER/PASSWORD through the runtime environment.
<system>
  log_level info
</system>

<source>
  @type tail
  @id application_log
  @label @INGEST
  path /var/log/task-manager/*.log
  pos_file /var/log/fluentd/positions/application.pos
  tag application.task-manager
  path_key source_path
  read_from_head true
  <parse>
    @type none
    message_key message
  </parse>
</source>

<source>
  @type tail
  @id kubernetes_container_logs
  @label @INGEST
  path /var/log/containers/*.log
  pos_file /var/log/fluentd/positions/kubernetes-containers.pos
  tag kubernetes.*
  path_key source_path
  read_from_head true
  <parse>
    @type cri
  </parse>
</source>

<source>
  @type tail
  @id docker_container_logs
  @label @INGEST
  path /var/lib/docker/containers/*/*-json.log
  pos_file /var/log/fluentd/positions/docker-containers.pos
  tag docker.*
  path_key source_path
  read_from_head true
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%N%:z
    keep_time_key true
  </parse>
</source>

<label @INGEST>
  <filter kubernetes.**>
    @type kubernetes_metadata
  </filter>

  <filter **>
    @type record_transformer
    enable_ruby true
    <record>
      hostname ${hostname}
      log_source ${tag_parts[0]}
    </record>
  </filter>

  <match **>
    @type copy
    copy_mode deep
    <store>
      @type elasticsearch
      @id elasticsearch_output
      host "#{ENV['ELASTICSEARCH_HOST'] || 'elasticsearch'}"
      port "#{ENV['ELASTICSEARCH_PORT'] || '9200'}"
      scheme "#{ENV['ELASTICSEARCH_SCHEME'] || 'http'}"
      user "#{ENV['ELASTICSEARCH_USER']}"
      password "#{ENV['ELASTICSEARCH_PASSWORD']}"
      logstash_format true
      logstash_prefix task-manager
      include_tag_key true
      tag_key fluentd_tag
      suppress_type_name true
      reconnect_on_error true
      reload_connections false
      request_timeout 15s
      <buffer tag,time>
        @type file
        path /var/log/fluentd/buffer/elasticsearch
        timekey 1m
        timekey_wait 10s
        chunk_limit_size 8m
        retry_forever true
      </buffer>
    </store>
    <store>
      @type stdout
    </store>
  </match>
</label>
