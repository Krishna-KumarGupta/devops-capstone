---
- name: Configure Linux hosts for container workloads
  hosts: all
  become: true
  tasks:
    - name: Require Debian-family Linux
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: This playbook currently supports Debian and Ubuntu hosts.

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: ansible_swaptotal_mb | int > 0

    - name: Disable swap entries in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#]\S+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'
        backup: true

    - name: Load required kernel modules at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Load required kernel modules
      ansible.builtin.command: "modprobe {{ item }}"
      loop:
        - overlay
        - br_netfilter
      changed_when: false

    - name: Configure networking for Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        owner: root
        group: root
        mode: "0644"
      notify: Apply sysctl settings

  handlers:
    - name: Apply sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: true
